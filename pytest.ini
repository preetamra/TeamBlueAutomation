[pytest]
testpaths = tests
pythonpath = .
# -v: one line per test. --tb=short: a failure shows our lines, not library source code.
# importlib: two test files may share a name in different folders (e.g. ui/ and api/)
addopts = -v --tb=short --import-mode=importlib
markers =
    regression: subset re-run after a change to the text box page object or the API client (UI-10, API-01 to API-05)
